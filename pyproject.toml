[tool.poetry]
name = "nope-in"
version = "0.1.0"
description = "Neural Options Pricing Engine — India"
authors = ["NOPE-IN"]
readme = "README.md"
packages = [{ include = "nope_in", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0"
polars = "^1.0"
pyarrow = "^18.0"
yfinance = "^0.2"
requests = "^2.31"
tqdm = "^4.66"
hydra-core = "^1.3"
omegaconf = "^2.3"
great-expectations = "^0.18"
scipy = "^1.11"
scikit-learn = "^1.3"
hmmlearn = "^0.3"
matplotlib = "^3.8"
joblib = "^1.3"
torch = "^2.0"
pytorch-lightning = "^2.0"
mlflow = "^2.0"
shap = "^0.44"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
mypy = "^1.7"
black = "^24.0"
isort = "^5.13"
pre-commit = "^3.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
